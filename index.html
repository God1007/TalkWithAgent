<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TalkWithAgent · 任务讨论</title>
  <meta name="description" content="与绑定当前 Codex 会话的 agent 持续讨论任务。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232c5146'/%3E%3Cpath d='M7 9h18v11H15l-5 4v-4H7z' fill='%23e7f0df'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a href="/" class="brand" aria-label="TalkWithAgent 首页"><span class="mark" aria-hidden="true">T</span>TalkWithAgent</a>
    <span id="connection" class="connection" role="status">连接中</span>
  </header>
  <section class="task-strip" aria-label="当前 Codex 任务">
    <span class="task-label">CODEX</span>
    <strong id="task-name">正在连接任务</strong>
    <span id="task-status" class="pill"></span>
    <details id="task-details">
      <summary>会话信息</summary>
      <div class="details-content">
        <p id="task-update">等待任务进展</p>
        <p id="sync-detail" class="note">正在同步会话</p>
        <small>绑定的 Codex 会话</small><code id="main-id"></code>
        <small>讨论 agent</small><code id="discussion-id"></code>
        <small>工作目录 · 只读</small><code id="workspace-path"></code>
      </div>
    </details>
  </section>
  <main class="workspace" aria-label="当前任务的讨论">
    <div class="discussion-heading"><h1>任务讨论</h1><span id="sync-state" role="status">同步中</span></div>
    <div class="agent-picker">
      <label class="sr-only" for="agents">当前讨论 agent</label><select id="agents" aria-label="当前讨论 agent"><option>讨论 agent</option></select>
      <button type="button" id="add-agent" class="text-button">＋ 新增 agent</button>
    </div>
    <p id="agent-focus" class="agent-focus">共享当前 Codex 会话</p>
    <div id="messages" class="messages" role="log" aria-live="polite" aria-relevant="additions">
      <div id="empty" class="empty-detail"><span aria-hidden="true">“</span><h2>还没有讨论消息</h2><p>直接说说你对当前任务的想法。</p></div>
    </div>
    <div class="agent-status"><span id="agent-state" role="status">正在连接讨论 agent</span><button id="retry" class="text-button" hidden>重新思考</button></div>
    <p id="agent-error" class="error-note" role="status" hidden></p>
    <div id="delivery" class="delivery" role="status"></div>
    <form id="composer" class="composer">
      <div id="reply-context" class="reply-context" hidden><span id="reply-label"></span><button type="button" id="cancel-reply" aria-label="取消引用回复">×</button></div>
      <label class="sr-only" for="input">讨论当前任务</label>
      <textarea id="input" rows="2" maxlength="6000" placeholder="关于当前任务，说说你的想法…"></textarea>
      <div class="composer-actions"><button type="button" id="forward" class="text-button">把结论交给 Codex</button><button type="submit" id="send" class="primary">发送 ↑</button></div>
    </form>
  </main>
  <dialog id="agent-dialog"><form id="agent-form">
    <div class="dialog-heading"><h2>新增讨论 agent</h2><button type="button" data-close="agent-dialog" aria-label="关闭" class="text-button">×</button></div>
    <p class="note">自动共享当前 Codex session 的内容，保留独立的讨论记录。</p>
    <label for="agent-name">名称</label><input id="agent-name" required maxlength="40" autocomplete="off">
    <label for="agent-instructions">关注方向 <span class="note">选填</span></label><textarea id="agent-instructions" rows="3" maxlength="1500" placeholder="例如：一起讨论方案中的取舍和风险"></textarea>
    <button class="primary" type="submit" id="create-agent">创建 agent</button>
  </form></dialog>
  <dialog id="forward-dialog"><form id="forward-form">
    <div class="dialog-heading"><h2>把结论交给 Codex</h2><button type="button" data-close="forward-dialog" aria-label="关闭" class="text-button">×</button></div>
    <p class="note">将这段内容提交给当前 Codex 任务，作为执行要求。</p>
    <label for="forward-text">明确的结论或回答</label><textarea id="forward-text" rows="4" required maxlength="6000"></textarea>
    <button class="primary" type="submit">确认并回传</button>
  </form></dialog>
  <div id="toast" role="status" hidden></div>
</body>
</html>
